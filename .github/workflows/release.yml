name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  release:
    # Never elevate a PR, fork, manual CI run, or unsuccessful test run.
    if: >-
      github.repository == 'dragoscirjan/pi-config' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: '0'
      NPM_CONFIG_PROVENANCE: 'true'
      RELEASE_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RELEASE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Release precisely the commit that passed the complete CI matrix.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Calculate version and publish voice companion
        run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only for the first publication, before npm trusted publishing exists.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
